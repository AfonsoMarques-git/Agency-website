<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#04070d" />
  <title>Admin · WEMOV Agency</title>
  <link rel="icon" type="image/png" href="/assets/logo-wemov.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body class="admin admin--auth">
  <div class="admin-grain" aria-hidden="true"></div>

  <main class="auth">
    <div class="auth__panel">
      <header class="auth__head">
        <img src="/assets/logo-wemov.png" alt="WEMOV Agency" class="auth__logo" />
        <p class="auth__eyebrow">Admin · Beyond Stories</p>
        <h1 class="auth__title"><span>Iniciar</span> <em>sessão</em>.</h1>
        <p class="auth__lede">Acesso reservado ao gestor da plataforma WEMOV Agency.</p>
      </header>

      <form id="loginForm" class="auth__form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <div id="loginError" class="auth__error" hidden></div>

        <button type="submit" class="btn btn--primary">
          <span>Entrar</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <footer class="auth__foot">
        <a href="/">← Voltar ao site</a>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const errBox = document.getElementById('loginError');

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        errBox.hidden = true;
        errBox.textContent = '';

        const username = form.username.value.trim();
        const password = form.password.value;
        if (!username || !password) {
          errBox.textContent = 'Preencha utilizador e password.';
          errBox.hidden = false;
          return;
        }

        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;

        try {
          const r = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            errBox.textContent = data.error || 'Não foi possível autenticar.';
            errBox.hidden = false;
            return;
          }
          window.location.href = '/admin';
        } catch (e) {
          errBox.textContent = 'Erro de rede. Tente novamente.';
          errBox.hidden = false;
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
